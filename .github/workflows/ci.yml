name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check app/ tests/ scripts/

      - name: Format check (ruff)
        run: ruff format --check app/ tests/ scripts/
        continue-on-error: true

      - name: Type check (mypy)
        run: mypy app/

      # The whole suite is offline: LinkedIn is mocked at the transport layer,
      # so CI never needs a session cookie and never sends upstream traffic.
      - name: Test
        run: pytest -q --cov=app --cov-report=xml --cov-report=term

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert no .env is tracked
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is committed — it must stay untracked"
            exit 1
          fi
          echo "No .env tracked."

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: linkedin-profile-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot the container and probe /healthz
        run: |
          # No credentials supplied: the service must still start and report
          # itself unhealthy-but-alive rather than crash-looping.
          docker run -d --name api -p 8000:8000 \
            -e API_KEYS=ci-test-key \
            -e REQUIRE_API_KEY=true \
            linkedin-profile-api:ci

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz > /dev/null 2>&1; then
              echo "Healthy after ${i}s"
              curl -sS http://localhost:8000/healthz | tee /dev/stderr
              docker rm -f api
              exit 0
            fi
            sleep 1
          done

          echo "::error::Container did not become healthy"
          docker logs api
          docker rm -f api
          exit 1
